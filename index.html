<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>KK Partizan Premium</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: #0d0f12; color: #a0aec0; font-family: system-ui; }
        .p-card { background: #1a202c; border: 1px solid #2d3748; transition: 0.2s; }
        .p-card:hover { border-color: #fff; box-shadow: 0 0 15px rgba(255,255,255,0.1); }
        .act, .btn-p:hover { background: #fff !important; color: #000 !important; font-weight: bold; }
        .btn-p { background: #1a202c; border: 1px solid #2d3748; color: #fff; }
        .p-partizan { background: rgba(255,255,255,0.1) !important; color: #fff !important; font-weight: bold; }
    </style>
</head>
<body>

<div class="container py-4" style="max-width: 800px;">
    <div class="text-center mb-4">
        <h1 class="text-white fw-black">⚫⚪ KK PARTIZAN</h1>
        <div class="d-flex justify-content-center gap-2 my-3 flex-wrap" id="nav-bar">
            <button class="btn btn-p act" onclick="tab('ekipa', this)"><i class="bi bi-people"></i> Petorka</button>
            <button class="btn btn-p" onclick="tab('el', this)"><i class="bi bi-globe"></i> Evroliga</button>
            <button class="btn btn-p" onclick="tab('aba', this)"><i class="bi bi-trophy"></i> ABA</button>
            <button class="btn btn-p" onclick="tab('stat', this)"><i class="bi bi-bar-chart"></i> Stat</button>
        </div>
    </div>

    <!-- SEKCIJE -->
    <div id="ekipa" class="tab-sec">
        <h4 class="text-white text-center mb-3">⭐ Startna Petorka</h4>
        <div class="row g-2" id="petorka-box"></div>
    </div>

    <div id="el" class="tab-sec" style="display:none;">
        <h4 class="text-white text-center mb-3">🏆 Evroliga 2025/2026</h4>
        <table class="table table-dark table-sm table-bordered align-middle m-0" id="el-table"></table>
    </div>

    <div id="aba" class="tab-sec" style="display:none;">
        <h4 class="text-white text-center mb-3">🏀 ABA Liga</h4>
        <table class="table table-dark table-sm table-bordered align-middle m-0" id="aba-table"></table>
    </div>

    <div id="stat" class="tab-sec" style="display:none;">
        <h4 class="text-white text-center mb-3">📊 Sastav i Prosečni Poeni</h4>
        <div class="row g-2" id="stat-box"></div>
    </div>
</div>

<script>
// Pokazivači na podatke (Objekti u memoriji)
const igraci = [
    { n: "Carlik Jones", p: "PG", stat: "14.2 PPG", s: true, w: "85%" },
    { n: "Iffe Lundberg", p: "SG", stat: "11.5 PPG", s: true, w: "70%" },
    { n: "Isaac Bonga", p: "SF", stat: "9.6 PPG", s: true, w: "62%" },
    { n: "Brandon Davies", p: "PF", stat: "9.2 PPG", s: true, w: "60%" },
    { n: "Tyrique Jones", p: "C", stat: "12.8 PPG", s: true, w: "78%" },
    { n: "Frank Ntilikina", p: "G", stat: "7.8 PPG", s: false, w: "50%" },
    { n: "Sterling Brown", p: "G/F", stat: "8.5 PPG", s: false, w: "55%" },
    { n: "Vanja Marinković", p: "F", stat: "7.2 PPG", s: false, w: "48%" },
    { n: "Aleksej Pokuševski", p: "F/C", stat: "6.4 PPG", s: false, w: "42%" },
    { n: "Balša Koprivica", p: "C", stat: "5.1 PPG", s: false, w: "35%" }
];

const el = ["Real Madrid", "Olympiacos", "Barcelona", "Panathinaikos", "Fenerbahce", "Monaco", "Anadolu Efes", "PARTIZAN MOZZART BET", "Maccabi", "Virtus", "Baskonia", "Milano", "Crvena zvezda", "Zalgiris", "Bayern", "Asvel", "Alba", "Paris"];
const aba = ["PARTIZAN MOZZART BET", "Crvena zvezda", "Budućnost", "Cedevita Olimpija", "Dubai BC", "Mega MIS", "Zadar", "Igokea", "SC Derbi", "Borac", "FMP", "Cibona", "Krka", "Mornar", "Split", "Spartak"];

// Pokazivači (reference) na DOM elemente radi brzine i čistijeg koda
const ptr = {
    petorka: document.getElementById('petorka-box'),
    stat: document.getElementById('stat-box'),
    el: document.getElementById('el-table'),
    aba: document.getElementById('aba-table'),
    secs: document.querySelectorAll('.tab-sec')
};

// Generisanje sadržaja preko memorijskih pokazivača
ptr.petorka.innerHTML = igraci.filter(i => i.s).map(i => `
    <div class="col-md-4 col-6"><div class="p-card rounded p-3 text-center">
        <span class="badge bg-light text-dark fw-bold">${i.p}</span>
        <h6 class="text-white my-2">${i.n}</h6>
        <small class="text-muted">Startna Petorka</small>
    </div></div>`).join('');

ptr.stat.innerHTML = igraci.map(i => `
    <div class="col-md-6"><div class="p-card rounded p-3">
        <div class="d-flex justify-content-between text-white text-sm"><span>${i.n} (${i.p})</span><strong>${i.stat}</strong></div>
        <div class="progress mt-2 bg-dark" style="height:6px;"><div class="progress-bar bg-white" style="width:${i.w}"></div></div>
    </div></div>`).join('');

const renderTable = (domPtr, lista) => {
    domPtr.innerHTML = `<tr><th>#</th><th>Klub</th></tr>` + lista.map((t, r) => `
        <tr class="${t.includes('PARTIZAN') ? 'p-partizan' : ''}"><td>${r+1}</td><td>${t}</td></tr>`).join('');
};
renderTable(ptr.el, el);
renderTable(ptr.aba, aba);

// Funkcija za promenu tabova pomoću prosleđenog pokazivača na dugme (btn)
function tab(id, btn) {
    ptr.secs.forEach(s => s.style.display = 'none');
    document.querySelectorAll('.btn-p').forEach(b => b.classList.remove('act'));
    document.getElementById(id).style.display = 'block';
    btn.classList.add('act');
}
</script>
</body>
</html>
