<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KK Partizan Premium Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: #0d0f12; color: #a0aec0; font-family: system-ui; }
        .p-card { background: #1a202c; border: 1px solid #2d3748; transition: 0.2s; }
        .p-card:hover { border-color: #fff; box-shadow: 0 0 15px rgba(255,255,255,0.1); }
        .act, .btn-p:hover { background: #fff !important; color: #000 !important; font-weight: bold; }
        .btn-p { background: #1a202c; border: 1px solid #2d3748; color: #fff; }
        .p-partizan { background: rgba(255,255,255,0.1) !important; color: #fff !important; font-weight: bold; }
        .c-img { height: 400px; object-fit: cover; }
        @media (max-width: 768px) { .c-img { height: 250px; } }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary mb-4">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold text-white" href="#">⚫⚪ Partizan Hub</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="#" onclick="tab('home', this)">Početna</a></li>
                <li class="nav-item"><a class="nav-link" href="#" onclick="tab('kontakt', this)">Članstvo & Kontakt</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mb-4">
    <div id="partizanCarousel" class="carousel slide carousel-fade shadow rounded overflow-hidden" data-bs-ride="carousel">
        <div class="carousel-indicators" id="c-ind"></div>
        <div class="carousel-inner" id="c-inner"></div>
        <button class="carousel-control-prev" type="button" data-bs-target="#partizanCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#partizanCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>
</div>

<div class="container py-2" style="max-width: 900px;">
    <div id="home" class="main-sec">
        <div class="text-center mb-4">
            <h1 class="text-white fw-black">KK PARTIZAN MOZZART BET</h1>
            <div class="alert alert-info d-inline-block py-1 px-3 my-2" role="alert">
                <i class="bi bi-info-circle-fill"></i> Sezona 2025/2026 u jeku!
            </div>
            <div class="d-flex justify-content-center gap-2 my-3 flex-wrap" id="nav-bar">
                <button class="btn btn-p act" onclick="subTab('ekipa', this)"><i class="bi bi-people"></i> Petorka</button>
                <button class="btn btn-p" onclick="subTab('el', this)"><i class="bi bi-globe"></i> Evroliga</button>
                <button class="btn btn-p" onclick="subTab('aba', this)"><i class="bi bi-trophy"></i> ABA</button>
                <button class="btn btn-p" onclick="subTab('stat', this)"><i class="bi bi-bar-chart"></i> Stat</button>
            </div>
        </div>

        <div id="ekipa" class="tab-sec">
            <h4 class="text-white text-center mb-3">⭐ Startna Petorka</h4>
            <div class="row g-3 justify-content-center" id="petorka-box"></div>
        </div>

        <div id="el" class="tab-sec" style="display:none;">
            <h4 class="text-white text-center mb-3">🏆 Evroliga Tabela</h4>
            <div class="table-responsive"><table class="table table-dark table-sm table-bordered m-0" id="el-table"></table></div>
        </div>

        <div id="aba" class="tab-sec" style="display:none;">
            <h4 class="text-white text-center mb-3">🏀 ABA Liga Tabela</h4>
            <div class="table-responsive"><table class="table table-dark table-sm table-bordered m-0" id="aba-table"></table></div>
        </div>

        <div id="stat" class="tab-sec" style="display:none;">
            <h4 class="text-white text-center mb-3">📊 Sastav i Prosečni Poeni</h4>
            <div class="row g-2" id="stat-box"></div>
        </div>
    </div>

    <div id="kontakt" class="main-sec" style="display:none;">
        <div class="card p-4 bg-dark text-white border-secondary">
            <h3 class="mb-4 text-center">🎫 Postani Član / Kontakt Forma</h3>
            <form class="row g-3" onsubmit="event.preventDefault();">
                <div class="col-md-6">
                    <label class="form-label">Ime i prezime</label>
                    <input type="text" class="form-control" placeholder="Petar Petrović" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Broj telefona</label>
                    <input type="number" class="form-control" placeholder="063123456">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Datum rođenja</label>
                    <input type="date" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Izaberite sektor tribine</label>
                    <select class="form-select">
                        <option>Premium Salon</option>
                        <option>Nivo 200 (Bočno)</option>
                        <option>Nivo 400 (Jug)</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">Zadovoljstvo trenutnom sezonom (Opseg)</label>
                    <input type="range" class="form-range" min="1" max="10">
                </div>
                <div class="col-12">
                    <label class="form-label">Poruka ili sugestija za klub</label>
                    <textarea class="form-control" rows="3" placeholder="Napišite nešto..."></textarea>
                </div>
                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="c1">
                        <label class="form-check-label" for="c1">Prihvatam uslove članstva</label>
                    </div>
                </div>
                <div class="col-12">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="r" id="r1" checked>
                        <label class="form-check-label" for="r1">Godišnja karta</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="r" id="r2">
                        <label class="form-check-label" for="r2">Mesečna karta</label>
                    </div>
                </div>
                <div class="col-12 text-center">
                    <button type="submit" class="btn btn-light px-4">Pošalji zahtev</button>
                </div>
            </form>
        </div>
    </div>
</div>

<footer class="bg-dark text-center text-muted py-3 mt-5 border-top border-secondary">
    <p class="m-0">&copy; 2026 KK Partizan ISD. Sva prava zadržana.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const slike = [
    "https://images.unsplash.com/photo-1546519638-68e109498ffc", "https://images.unsplash.com/photo-1519766304817-4f37bda74a27",
    "https://images.unsplash.com/photo-1518063319789-7217e6706b04", "https://images.unsplash.com/photo-1574629810360-7efbbe195018",
    "https://images.unsplash.com/photo-1504450758481-7338eba7524a", "https://images.unsplash.com/photo-1511886929837-354d827aae26",
    "https://images.unsplash.com/photo-1519861531473-9200262188bf", "https://images.unsplash.com/photo-1587280501635-68a0e82cd5ff",
    "https://images.unsplash.com/photo-1465101162946-4377e57745c3", "https://images.unsplash.com/photo-1569517282132-25d22f4573e6"
];

const igraci = [
    { n: "Carlik Jones", p: "PG", stat: "14.2 PPG", s: true, w: "85%", img: "https://images.unsplash.com/photo-1533750516457-a7f992034fec" },
    { n: "Iffe Lundberg", p: "SG", stat: "11.5 PPG", s: true, w: "70%", img: "https://images.unsplash.com/photo-1505664194779-8beaceb93744" },
    { n: "Isaac Bonga", p: "SF", stat: "9.6 PPG", s: true, w: "62%", img: "https://images.unsplash.com/photo-1515523110800-9415d13b84a8" },
    { n: "Brandon Davies", p: "PF", stat: "9.2 PPG", s: true, w: "60%", img: "https://images.unsplash.com/photo-1544698310-74ea9d1c8258" },
    { n: "Tyrique Jones", p: "C", stat: "12.8 PPG", s: true, w: "78%", img: "https://images.unsplash.com/photo-1577471488278-16eec37ffcc2" },
    { n: "Frank Ntilikina", p: "G", stat: "7.8 PPG", s: false, w: "50%", img: "https://images.unsplash.com/photo-1519766304817-4f37bda74a27" },
    { n: "Sterling Brown", p: "G/F", stat: "8.5 PPG", s: false, w: "55%", img: "https://images.unsplash.com/photo-1546519638-68e109498ffc" },
    { n: "Vanja Marinković", p: "F", stat: "7.2 PPG", s: false, w: "48%", img: "https://images.unsplash.com/photo-1518063319789-7217e6706b04" },
    { n: "Aleksej Pokuševski", p: "F/C", stat: "6.4 PPG", s: false, w: "42%", img: "https://images.unsplash.com/photo-1504450758481-7338eba7524a" },
    { n: "Balša Koprivica", p: "C", stat: "5.1 PPG", s: false, w: "35%", img: "https://images.unsplash.com/photo-1511886929837-354d827aae26" }
];

const el = ["Real Madrid", "Olympiacos", "Barcelona", "Panathinaikos", "Fenerbahce", "Monaco", "Anadolu Efes", "PARTIZAN MOZZART BET", "Maccabi", "Virtus", "Baskonia", "Milano", "Crvena zvezda", "Zalgiris", "Bayern", "Asvel", "Alba", "Paris"];
const aba = ["PARTIZAN MOZZART BET", "Crvena zvezda", "Budućnost", "Cedevita Olimpija", "Dubai BC", "Mega MIS", "Zadar", "Igokea", "SC Derbi", "Borac", "FMP", "Cibona", "Krka", "Mornar", "Split", "Spartak"];

const ptr = {
    petorka: document.getElementById('petorka-box'),
    stat: document.getElementById('stat-box'),
    el: document.getElementById('el-table'),
    aba: document.getElementById('aba-table'),
    subSecs: document.querySelectorAll('.tab-sec'),
    mainSecs: document.querySelectorAll('.main-sec'),
    ind: document.getElementById('c-ind'),
    inner: document.getElementById('c-inner')
};

ptr.ind.innerHTML = slike.map((_, i) => `<button type="button" data-bs-target="#partizanCarousel" data-bs-slide-to="${i}" class="${i===0?'active':''}"></button>`).join('');
ptr.inner.innerHTML = slike.map((s, i) => `
    <div class="carousel-item ${i===0?'active':''}">
        <picture>
            <source media="(max-width: 768px)" srcset="${s}?q=60&w=600&auto=format&fit=crop&h=400">
            <img src="${s}?q=80&w=1200&auto=format&fit=crop&h=600" class="d-block w-100 c-img" alt="Partizan Slide">
        </picture>
    </div>`).join('');

ptr.petorka.innerHTML = igraci.filter(i => i.s).map(i => `
    <div class="col-md-4 col-6">
        <div class="p-card rounded overflow-hidden text-center h-100">
            <img src="${i.img}?q=70&w=300&auto=format&fit=crop&h=300" class="w-100" style="height:180px; object-fit:cover;">
            <div class="p-3">
                <span class="badge bg-light text-dark fw-bold">${i.p}</span>
                <h5 class="text-white my-2">${i.n}</h5>
                <small class="text-muted">Startna Petorka</small>
            </div>
        </div>
    </div>`).join('');

ptr.stat.innerHTML = igraci.map(i => `
    <div class="col-md-6"><div class="p-card rounded p-3 d-flex align-items-center gap-3">
        <img src="${i.img}?q=40&w=80&auto=format&fit=crop&h=80" class="rounded-circle" style="width:50px; height:50px; object-fit:cover;">
        <div class="w-100">
            <div class="d-flex justify-content-between text-white text-sm"><span>${i.n} (${i.p})</span><strong>${i.stat}</strong></div>
            <div class="progress mt-2 bg-dark" style="height:6px;"><div class="progress-bar bg-white" style="width:${i.w}"></div></div>
        </div>
    </div></div>`).join('');

const renderTable = (domPtr, lista) => {
    domPtr.innerHTML = `<thead><tr><th>#</th><th>Klub</th></tr></thead><tbody>` + lista.map((t, r) => `
        <tr class="${t.includes('PARTIZAN') ? 'p-partizan' : ''}"><td>${r+1}</td><td>${t}</td></tr>`).join('') + `</tbody>`;
};
renderTable(ptr.el, el);
renderTable(ptr.aba, aba);

function subTab(id, btn) {
    ptr.subSecs.forEach(s => s.style.display = 'none');
    document.querySelectorAll('#nav-bar .btn-p').forEach(b => b.classList.remove('act'));
    document.getElementById(id).style.display = 'block';
    btn.classList.add('act');
}

function tab(id, btn) {
    ptr.mainSecs.forEach(s => s.style.display = 'none');
    document.querySelectorAll('.navbar-nav .nav-link').forEach(l => l.classList.remove('active'));
    document.getElementById(id).style.display = 'block';
    btn.classList.add('active');
}
</script>
</body>
</html>
